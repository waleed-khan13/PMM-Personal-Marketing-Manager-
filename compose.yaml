name: localgrowth-os

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local_trusted}
      LOCALGROWTH_DATA_DIR: /app/data
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - localgrowth-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  localgrowth-data:
